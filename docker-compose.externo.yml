# LEX PACS "lite" — Orthanc EXTERNO (ex.: Orthanc da prefeitura), sem Keycloak.
#
# Sobe só: portal (usuários locais), web-viewer (OHIF) e gateway (nginx).
# NÃO sobe Orthanc, Postgres nem o serviço de backup (sem socket do Docker).
#
# Orthanc somente por variáveis de ambiente (nada fixo no repo):
#   ORTHANC_URL       ex.: http://10.0.0.10:8042  (rede interna/VPN; nunca IP público)
#   ORTHANC_USERNAME  usuário de leitura do Orthanc (Basic Auth)
#   ORTHANC_PASSWORD  senha desse usuário
# O navegador nunca fala com o Orthanc: só o gateway, com GET (QIDO/WADO) após auth_request.
#
# Piloto (V4): primeiro contra um Orthanc de TESTE; no real, só leitura e com aprovação do Leandro.
#
#   docker compose -f docker-compose.externo.yml --env-file .env.externo up -d --build

name: lex-pacs-externo

services:
  web-viewer:
    image: "lex-pacs/viewer:${LEX_PACS_VERSION:-0.7.0}"
    build:
      context: ./ohif-viewer
      dockerfile: Dockerfile
      target: ohif
      args:
        LEX_PACS_VERSION: ${LEX_PACS_VERSION:-0.7.0}
    expose:
      - "80"
    restart: unless-stopped

  portal:
    image: "lex-pacs/portal:${LEX_PACS_VERSION:-0.7.0}"
    build:
      context: ./lex-pacs-portal
      dockerfile: Dockerfile
      args:
        LEX_PACS_VERSION: ${LEX_PACS_VERSION:-0.7.0}
    expose:
      - "8080"
    environment:
      ORTHANC_URL: ${ORTHANC_URL:?defina ORTHANC_URL}
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-}
      ORTHANC_EXTERNAL_READONLY: "true"
      OHIF_VIEWER_URL: ${OHIF_VIEWER_URL:?defina OHIF_VIEWER_URL}
      JWT_SECRET: ${PORTAL_JWT_SECRET:?defina PORTAL_JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LEX_ADMIN_USER: ${LEX_ADMIN_USER:?defina LEX_ADMIN_USER}
      LEX_ADMIN_PASSWORD: ${LEX_ADMIN_PASSWORD:?defina LEX_ADMIN_PASSWORD}
      LOCAL_USERS_DB_PATH: /lex-data/users.db
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      AUDIT_DATA_PATH: /lex-audit
      REPORTS_DATA_PATH: /lex-reports
      LEX_PACS_VERSION: ${LEX_PACS_VERSION:-0.7.0}
    volumes:
      - lex-data:/lex-data
      - lex-audit:/lex-audit
      - lex-reports:/lex-reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  gateway:
    image: "lex-pacs/gateway:${LEX_PACS_VERSION:-0.7.0}"
    build:
      context: ./ohif-viewer/nginx
      dockerfile: Dockerfile
    environment:
      LEX_ORTHANC_URL: ${ORTHANC_URL:?defina ORTHANC_URL}
      LEX_ORTHANC_USERNAME: ${ORTHANC_USERNAME:-}
      LEX_ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-}
    ports:
      - "${LEX_HTTP_PORT:-8080}:80"
    depends_on:
      portal:
        condition: service_healthy
      web-viewer:
        condition: service_started
    restart: unless-stopped

volumes:
  lex-data:
  lex-audit:
  lex-reports:
