# Zonas e mapas de segurança LEX PACS (http context via conf.d)

# S10 — rate limit em endpoints de login (por IP)
limit_req_zone $binary_remote_addr zone=lex_login:10m rate=20r/m;
limit_req_status 429;

# S11 — HSTS quando TLS termina no proxy externo
map $http_x_forwarded_proto $lex_hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# LP9 (parcial) — access log SEM query string e SEM Referer:
# a busca da lista (QIDO em /dicom-web/studies?PatientName=...&00100020=...) e a URL
# da própria lista (/viewer/?patientName=...) não podem ir para o log do proxy.
# $uri = caminho sem argumentos; nada de $request, $request_uri, $args nem $http_referer.
log_format lex_sem_args '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent" $request_time';
